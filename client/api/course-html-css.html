<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>קורס HTML & CSS</title>

  <!-- פונט Heebo -->
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />

  <!-- ה-CSS הכללי שלך -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>


  <!-- Hero קיים שלך -->
  <section class="hero_class">
    <div class="right_container">
      <h1 class="hero_h">HTML & CSS</h1>
      <p class="hero_p">סימנטיקה, Grid/Flexbox ו־Responsive Design.</p>
      <button class="hero_b" onclick="document.getElementById('learn').scrollIntoView({behavior:'smooth'})">
       להתחלת צפייה

      </button>
    </div>
    <div class="left_container"></div>
  </section>

  <!-- אזור הקורס: וידאו + פלייליסט -->
  <section id="learn" class="strengths_c">
    <div class="course-layout">
      <!-- עמודת הווידאו -->
      <section
        id="youtubeSection"
        class="course-video"
        data-video-id="2qMfwOq49ms"               <!-- אפשר להחליף לסרטון פתיחה אחר -->
        data-playlist-id="PL0eyrZgxdwhwNC5ppZo_dYGVjerQY3xYU"
      >
        <h2 id="youtubeTitle" class="video-title"></h2>
        <!-- iframe יתווסף פה אוטומטית ע"י youtube.js -->
        <div id="youtubeDescription" class="video-desc"></div>
      </section>

      <!-- עמודת הפלייליסט -->
      <aside class="playlist">
        <h3 class="playlist-title">תוכן הקורס</h3>
        <div id="playlistList" class="playlist-list">
          <!-- פריטים דינמיים מה-API -->
        </div>
        <div class="playlist-actions">
          <button id="playlistPrev" class="playlist-btn" hidden>עמוד קודם</button>
          <button id="playlistNext" class="playlist-btn" hidden>עמוד הבא</button>
        </div>
      </aside>
    </div>
  </section>

  <script src="youtube.js"></script>
  <script src="weather.js"></script>
  <script src="/client/loadHeader.js"></script>
  
  
</body>
</html>
