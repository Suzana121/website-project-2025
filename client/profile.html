<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפרופיל שלי | אתר הקורסים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="container">
        <header class="profile-header">
            <div class="user-info">
                <div class="user-avatar">
                    <span id="userInitial">👤</span>
                </div>
                <div class="user-details">
                    <h1 id="userName">שלום, משתמש</h1>
                    <p id="userEmail">email@example.com</p>
                    <span class="user-role" id="userRole">תלמיד</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-home" onclick="goHome()">
                    <span>🏠</span> חזרה לבית
                </button>
                <button class="btn-logout" onclick="logout()">
                    <span>🚪</span> התנתק
                </button>
            </div>
        </header>

        <div class="stats-container">
            <div class="stat-card">
                <p>קורסים שנרכשו</p>
                
                <div class="stat-row"> 
                    <h3 id="totalCourses">0</h3> 
                    <div class="stat-icon">📚</div> 
                </div>
            </div>

            <div class="stat-card">
                <p>חבר מאז</p>
                
                <div class="stat-row"> 
                    <h3 id="memberSince">נוב' 2025</h3> 
                    <div class="stat-icon">🎓</div> 
                </div>
            </div>

            <div class="stat-card">  
                <p>סטטוס</p>
                
                <div class="stat-row"> 
                    <h3 id="userStatus">פעיל</h3> 
                    <div class="stat-icon">✨</div> 
                </div>
            </div>
        </div>

        <section class="courses-section">
            <div class="section-header">
                <h2>הקורסים שלי</h2>
                <span class="courses-count" id="coursesCount">0 קורסים</span>
            </div>

            <div id="loadingSpinner" class="loading">
                <div class="spinner"></div>
                <p>טוען קורסים...</p>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">📭</div>
                <h3>עדיין לא רכשת קורסים</h3>
                <p>התחל את מסע הלמידה שלך עכשיו!</p>
                <button class="btn-primary" onclick="goHome()">עבור לקטלוג הקורסים</button>
            </div>

            <div id="coursesList" class="courses-grid"></div>
        </section>
    </div>

    <script src="profile.js"></script>
    <script src="loadHeader.js"></script>

</body>
</html>
