<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">טוען קורס...</title>

  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Hero -->
  <section class="hero_class">
    <div class="right_container">
      <h1 class="hero_h" id="courseTitle">...</h1>
      <p class="hero_p" id="courseTagline">טוען תיאור קצר...</p>

      <button class="hero_b"
        onclick="document.getElementById('learn').scrollIntoView({behavior:'smooth'})">
        להתחלת צפייה
      </button>
    </div>
    <div class="left_container"></div>
  </section>

  <!-- Course Content -->
  <section id="learn" class="strengths_c">
    <div class="course-layout">

      <!-- אזור הווידאו -->
      <section
        id="youtubeSection"
        class="course-video"
        data-video-id=""
        data-playlist-id="">
        
        <div id="videoPlayer"></div>

        <h2 id="youtubeTitle" class="video-title">טוען כותרת וידאו...</h2>
        <div id="youtubeDescription" class="video-desc"></div>
      </section>

      <!-- פלייליסט -->
      <aside class="playlist">
        <h3 class="playlist-title">תוכן הקורס</h3>
        <div id="playlistList" class="playlist-list">
          <p style="text-align: center; color: #555;">טוען שיעורים...</p>
        </div>

        <div class="playlist-actions">
          <button id="playlistPrev" class="playlist-btn" hidden>עמוד קודם</button>
          <button id="playlistNext" class="playlist-btn" hidden>עמוד הבא</button>
        </div>
      </aside>

    </div>
  </section>

  <script src="youtube.js"></script>
  <script src="single-course.js"></script>
  <script src="loadHeader.js"></script>
</body>
</html>
