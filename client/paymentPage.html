<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תשלום</title>
    <link rel="stylesheet" href="paymentPage.css"> 
</head>
<body>
    <div class="checkout">
        <div class="left">
            <div class="lists">
                
                <section id="chosenCard" class="card">
                    <h2 class="courses-header">הקורסים שבחרתי</h2>
                    <div id="chosen" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
                        </div>
                </section>

                <section id="bonusCard" class="card">
                    <h2 class="courses-header">הקורסים שלנו</h2>

                    <div id="bonus" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
                        </div>
                </section>
            </div>

            <section class="card" style="margin-top:12px;">
                <div class="summary">
                    <div class="small">סה"כ קורסים:</div>
                    <div id="itemsCount">0</div> 
                </div>
                <div class="summary">
                    <div class="small">סה"כ לתשלום:</div>
                    <div id="total">0.00 ₪</div> 
                </div>
            </section>
        </div>

        <aside class="right card payment">
            <h2>פרטי תשלום</h2>
            <form id="paymentForm" autocomplete="off">
                <label class="small">שם על הכרטיס</label>
                <input type="text" id="cardName" placeholder="שם מלא כפי שמופיע על הכרטיס" required>

                <label class="small">מספר כרטיס</label>
                <input type="tel" id="cardNumber" inputmode="numeric" pattern="[0-9\s]{13,19}" maxlength="19" placeholder="XXXX XXXX XXXX XXXX" required>

                <div style="display:flex; gap:8px;">
                    <div style="flex:1">
                        <label class="small">תוקף (MM/YY)</label>
                        <input type="text" id="exp" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div style="width:120px">
                        <label class="small">CVC</label>
                        <input type="tel" id="cvc" inputmode="numeric" maxlength="4" placeholder="123" required>
                    </div>
                </div>

                <div class="small">סכום לחיוב: <strong id="payAmount">0.00 ₪</strong></div> 
                <button class="pay-btn" type="submit">שלם עכשיו</button>
                <div class="notice" id="notice" style="display:none;">התשלום בוצע בהצלחה!</div>
            </form>
        </aside>
    </div>

    <script src="paymentPage.js"></script>
    <script src="loadHeader.js"></script>
</body>
</html>
