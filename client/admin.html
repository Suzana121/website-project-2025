<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מערכת - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">

       

        <div id="message" class="message hidden"></div>

        <div class="main-tabs">
            <button class="tab-btn active" data-target="users-section">ניהול משתמשים</button>
            <button class="tab-btn" data-target="courses-section">ניהול קורסים</button>
        </div>
        
        <div id="users-section" class="content-section active admin-section">
             <h1>ניהול מערכת</h1>
             <div id="roleStats" style="margin-bottom: 25px;"></div>
            <h2>משתמשים רשומים</h2>

            
            
            <div class="sort-container" style="margin-bottom:15px; text-align:right;">
                <button class="sort-dropdown-btn" id="sort-btn">
                    מיין לפי: שם ▼
                </button>
                <ul class="sort-dropdown-list hidden" id="sort-list">
                    <li data-field="name">שם</li>
                    <li data-field="email">אימייל</li>
                    <li data-field="idNumber">תעודת זהות</li>
                    <li data-field="roleText">תפקיד</li>
                </ul>
                <button class="sort-btn" onclick="toggleSortDirection()">⬍ החלף כיוון מיון</button>
            </div>

            <div class="users-table">
                <table>
                    <thead>
                        <tr>
                            <th>שם</th>
                            <th>אימייל</th>
                            <th>תעודת זהות</th>
                            <th>תפקיד נוכחי</th>
                            <th>שינוי תפקיד</th>
                            <th>פעולות</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <tr>
                            <td colspan="6" style="text-align:center;padding:20px;">טוען נתונים...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="courses-section" class="content-section hidden admin-section">
            <h2>ניהול קורסים</h2>
            
            <div id="courses-stats-container" style="margin-bottom: 25px;">
                </div>
            <div class="courses-actions" style="margin-bottom: 20px; text-align: right;">
                <button class="btn btn-create" id="open-create-course-btn">➕ הוסף קורס חדש</button>
            </div>

            <div class="course-list-container" id="courses-list-container">
                <p style="text-align:center;padding:20px;">טוען קורסים...</p>
            </div>
            
            <div id="course-form-container" class="course-edit-inline hidden">
                <h3 id="form-title">יצירת קורס חדש</h3>
                <form id="course-form" class="edit-form">
                    <input type="hidden" id="course-id">
                    
                    <div class="form-group">
                        <div id="error-title" class="validation-error hidden"></div>
                        <label for="course-title">כותרת הקורס:</label>
                        <input type="text" id="course-title" name="title" required minlength="2">
                    </div>
                    
                    <div class="form-group">
                        <div id="error-tagline" class="validation-error hidden"></div>
                        <label for="course-tagline">כותרת משנה/תקציר:</label>
                        <input type="text" id="course-tagline" name="tagline">
                    </div>
                    
                    <div class="form-group">
                        <div id="error-description" class="validation-error hidden"></div>
                        <label for="course-description">תיאור מלא:</label>
                        <textarea id="course-description" name="description" rows="4" required minlength="10"></textarea>
                    </div>

                    <div class="form-group">
                        <div id="error-price" class="validation-error hidden"></div>
                        <label for="course-price">מחיר (₪):</label>
                        <input type="number" id="course-price" name="price" step="0.01" required min="0">
                    </div>

                    <div class="form-group">
                        <div id="error-image" class="validation-error hidden"></div>
                        <label for="course-image">תמונת קורס (URL או נתיב יחסי):</label>
                        <input type="text" id="course-image" name="image" placeholder="למשל: assets/html css.png או https://...">
                    </div>
                    

                    
                    <hr style="margin: 25px 0;">

                    <h3>🎥 ניהול שיעורים (Course Content)</h3>
                    <p style="font-size: 0.9em; color: #555;">הזן/י את פרטי כל שיעור. מספר השיעור נקבע אוטומטית.</p>

                    <div id="error-course-content" class="validation-error hidden"></div>
                    
                    <div id="course-content-container">
                        </div>

                    <button type="button" class="btn btn-secondary" onclick="addLessonRow()">➕ הוסף שיעור</button>

                    <hr style="margin: 25px 0;">


                    <div class="form-actions">
                         <button type="submit" class="btn btn-save" id="save-course-btn">שמור קורס</button>
                         <button type="button" class="btn btn-delete" onclick="closeCourseForm()">בטל</button>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <script src="admin.js"></script>
    <script src="loadHeader.js"></script>
</body>
</html>
