<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>איפוס סיסמה</title>
    <link rel="stylesheet" href="resetPassword.css">
</head>
<body>
    <div class="container">
        <div class="form-box">
            <h2>איפוס סיסמה</h2>
            <div class="message hidden" id="message"></div>
            <form id="resetPasswordForm" class="form-content active">
                <div class="form-group">
                    <label for="newPassword">סיסמה חדשה</label>
                    <input type="password" id="newPassword" placeholder="הכנס סיסמה חדשה" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">אימות סיסמה</label>
                    <input type="password" id="confirmPassword" placeholder="הכנס שוב את הסיסמה" required>
                </div>
                <button type="submit" class="submit-button">אפס סיסמה</button>
                <button type="button" class="submit-button" onclick="window.location.href='login.html'">התחברות</button>
            </form>
        </div>
    </div>

    <script src="resetPassword.js"></script>
</body>
</html>
